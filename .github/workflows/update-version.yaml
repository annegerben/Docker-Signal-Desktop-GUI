name: Update Signal Version

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Signal Desktop version
        run: |
          curl -s https://api.github.com/repos/signalapp/Signal-Desktop/releases/latest \
          | jq -r '.tag_name' > latest.version

      - name: Compare with current version
        run: |
          if ! cmp -s latest.version signal.version; then
            mv latest.version signal.version
            echo "VERSION_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Commit updated version
        if: env.VERSION_UPDATED == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add signal.version
          git commit -m "Update Signal version"
          git push
