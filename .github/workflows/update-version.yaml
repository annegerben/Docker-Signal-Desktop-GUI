name: Update Signal Version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SIGNAL }}
          ref: develop
          persist-credentials: true
          fetch-depth: 0

      - name: Get latest Signal version
        id: get_version
        run: |
          LATEST_VERSION=$(curl -s https://updates.signal.org/desktop/apt/dists/xenial/main/binary-amd64/Packages | grep -A 5 "Package: signal-desktop" | grep "Version:" | awk '{print $2}' | head -n 1)
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Update signal.version file
        id: update_file
        run: |
          CURRENT_VERSION=$(cat signal.version)
          LATEST_VERSION="${{ steps.get_version.outputs.latest_version }}"
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "$LATEST_VERSION" > signal.version
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push changes
        if: steps.update_file.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add signal.version
          git commit -m "chore: update signal version to ${{ steps.get_version.outputs.latest_version }}"
          git pull --rebase origin develop
          git push origin develop
