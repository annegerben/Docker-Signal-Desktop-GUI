name: Build and Push Docker Image

on:
  push:
    branches: [develop, main]
    tags: ['v*']
    paths:
      - 'signal.version'

  pull_request:
    branches: [develop, main]
    paths:
      - 'signal.version'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Read version from file
        id: get_version
        run: echo "VERSION=$(cat signal.version)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/signal-desktop:latest
            ${{ secrets.DOCKER_USER }}/signal-desktop:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag from version
        if: github.event_name == 'push'
        env:
          PAT: ${{ secrets.ACTIONS_PAT }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch --tags
          git tag -a "${{ env.VERSION }}" -m "Release version ${{ env.VERSION }}"
          git push https://x-access-token:${PAT}@github.com/${{ github.repository }} "${{ env.VERSION }}"
